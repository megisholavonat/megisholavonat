    <path d="M24 76V30L50 58L76 30V76" fill="none" stroke="#F2F3F5" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" mask="url(#cut)"/>
    <circle cx="76" cy="30" r="7.5" fill="#F2C230"/>
