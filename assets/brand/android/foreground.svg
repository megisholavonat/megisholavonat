    <rect width="100" height="100" fill="#FFFFFF"/>
    <path d="M24 76V30L50 58L76 30V76" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="76" cy="30" r="10.5" fill="#000000"/>
