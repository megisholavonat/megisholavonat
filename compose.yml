services:
  redis:
    image: redis:8
    container_name: mhav-redis
    restart: unless-stopped
    ports:
      - "${MHAV_REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data

  postgres:
    image: postgres:18
    container_name: mhav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mhav
      POSTGRES_PASSWORD: mhav
      POSTGRES_DB: mhav
    ports:
      - "${MHAV_POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps its data in a versioned subdirectory of /var/lib/postgresql
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhav -d mhav"]
      interval: 5s
      timeout: 5s
      retries: 10
